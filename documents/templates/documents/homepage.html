<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Documents</title>
    <style>
        :root {
            --primary: #0b3d91;
            --accent: #1e88e5;
            --accent-soft: #e3f2fd;
            --border: #d6e4f0;
            --text: #1a2332;
            --muted: #5a6a7a;
            --success: #1b7a4a;
            --danger: #c62828;
            --radius: 16px;
            --shadow: 0 12px 40px rgba(11, 61, 145, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(1200px 600px at 10% -10%, #dcefff 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 0%, #eef6ff 0%, transparent 50%),
                #f4f8fc;
            min-height: 100vh;
            color: var(--text);
            padding: 28px 16px 48px;
        }
        .wrap { max-width: 880px; margin: 0 auto; }
        .topbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 14px;
        }
        .admin-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 650;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
        }
        .admin-btn:hover { background: #0a347c; }
        .card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(214, 228, 240, 0.9);
            overflow: hidden;
        }
        .card-head {
            padding: 28px 28px 18px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, #fff 0%, #f8fbff 100%);
        }
        .card-head h1 {
            font-size: 28px;
            font-weight: 750;
            color: var(--primary);
            letter-spacing: -0.03em;
        }
        .card-head p { margin-top: 6px; color: var(--muted); font-size: 14px; }
        .card-body { padding: 24px 28px 28px; }
        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            background: #fff;
            color: var(--text);
        }
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.15);
        }
        .docs-panel {
            margin-top: 22px;
            display: none;
        }
        .docs-panel.visible { display: block; }
        .docs-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .docs-toolbar h2 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }
        .docs-toolbar button {
            border: none;
            background: transparent;
            color: var(--accent);
            font-weight: 650;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }
        .doc-list {
            display: grid;
            gap: 10px;
            max-height: 420px;
            overflow: auto;
            padding-right: 4px;
        }
        .doc-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 14px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fbfdff;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
        }
        .doc-item:hover { border-color: #90caf9; background: #fff; }
        .doc-item.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
            box-shadow: 0 0 0 1px rgba(30, 136, 229, 0.2);
        }
        .doc-item input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }
        .doc-meta { flex: 1; min-width: 0; }
        .doc-name { font-weight: 700; font-size: 14px; color: var(--text); }
        .doc-desc { margin-top: 4px; font-size: 13px; color: var(--muted); line-height: 1.4; }
        .badge {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .badge-template { background: #e8f5e9; color: #2e7d32; }
        .badge-file { background: #eceff1; color: #455a64; }
        .empty {
            padding: 28px 16px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 12px;
            font-size: 14px;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            color: var(--text);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1565c0, #1e88e5);
            color: #fff;
            border: none;
            box-shadow: 0 8px 20px rgba(30, 136, 229, 0.25);
        }
        .btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-ghost { background: #fff; }
        .selected-count { font-size: 13px; color: var(--muted); font-weight: 600; }
        .alert {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .alert.show { display: block; }
        .alert.ok { background: #e8f5e9; color: var(--success); }
        .alert.err { background: #ffebee; color: var(--danger); }
        .custom-strip {
            margin-top: 18px;
            padding: 16px 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: linear-gradient(90deg, #f7fbff, #fff);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .custom-strip h3 { font-size: 14px; color: var(--primary); }
        .custom-strip p { font-size: 13px; color: var(--muted); margin-top: 2px; }
        @media (max-width: 640px) {
            .card-head, .card-body { padding-left: 18px; padding-right: 18px; }
        }
    </style>
    <script src="{% static 'documents/ghl_location.js' %}"></script>
</head>
<body>
    <div class="wrap">
        <div class="topbar">
            <a class="admin-btn" href="#" id="btn-catalog">+ Admin Catalog Manager</a>
        </div>
        <div class="card">
            <div class="card-head">
                <h1>Request Documents</h1>
                <p>Choose a loan program, select the documents to request, then send to the client.</p>
            </div>
            <div class="card-body">
                <label class="field-label" for="loan-program">Select Loan Program</label>
                <select id="loan-program">
                    <option value="">Loading loan programs…</option>
                </select>

                <div class="docs-panel" id="docs-panel">
                    <div class="docs-toolbar">
                        <h2>Required documents</h2>
                        <button type="button" id="btn-toggle-all">Select all</button>
                    </div>
                    <div class="doc-list" id="doc-list"></div>
                    <div class="actions">
                        <span class="selected-count" id="selected-count">0 selected</span>
                        <button type="button" class="btn btn-primary" id="btn-send" disabled>Send Request</button>
                    </div>
                </div>

                <div class="alert" id="alert" role="status"></div>

                <div class="custom-strip">
                    <div>
                        <h3>Request Individual Documents</h3>
                        <p>Create a one-off custom document for this opportunity.</p>
                    </div>
                    <a class="btn btn-ghost" href="#" id="btn-individual">Open custom docs →</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var requestId = "{{ request_id|escapejs }}";
            var loanSelect = document.getElementById("loan-program");
            var docsPanel = document.getElementById("docs-panel");
            var docList = document.getElementById("doc-list");
            var btnSend = document.getElementById("btn-send");
            var btnToggleAll = document.getElementById("btn-toggle-all");
            var selectedCount = document.getElementById("selected-count");
            var alertEl = document.getElementById("alert");
            var currentDocs = [];

            function withLoc(url) {
                if (typeof withLocationQuery === "function") return withLocationQuery(url);
                return url;
            }
            function preserve(path) {
                if (typeof preserveQueryHref === "function") return preserveQueryHref(path);
                return path + (window.location.search || "");
            }
            function showAlert(msg, ok) {
                alertEl.textContent = msg;
                alertEl.className = "alert show " + (ok ? "ok" : "err");
            }
            function clearAlert() {
                alertEl.className = "alert";
                alertEl.textContent = "";
            }

            document.getElementById("btn-catalog").href = preserve("/" + requestId + "/request/admin/library/");
            document.getElementById("btn-individual").href = preserve("/" + requestId + "/request/admin/individual-documents/");

            function selectedIds() {
                return Array.prototype.map.call(
                    docList.querySelectorAll('input[type="checkbox"]:checked'),
                    function (el) { return parseInt(el.value, 10); }
                );
            }
            function refreshCount() {
                var n = selectedIds().length;
                selectedCount.textContent = n + " selected";
                btnSend.disabled = n === 0;
                var total = docList.querySelectorAll('input[type="checkbox"]').length;
                btnToggleAll.textContent = (n && n === total) ? "Clear all" : "Select all";
            }

            function renderDocs(docs) {
                currentDocs = docs || [];
                if (!currentDocs.length) {
                    docList.innerHTML = '<div class="empty">No documents in this loan program yet. Add them in Catalog Admin.</div>';
                    docsPanel.classList.add("visible");
                    refreshCount();
                    return;
                }
                docList.innerHTML = currentDocs.map(function (d) {
                    var mode = d.attachment_mode === "template" ? "template" : "file";
                    var badge = mode === "template"
                        ? '<span class="badge badge-template">Template download</span>'
                        : '<span class="badge badge-file">Upload only</span>';
                    var desc = (d.description || "").trim();
                    return (
                        '<label class="doc-item" data-id="' + d.id + '">' +
                            '<input type="checkbox" value="' + d.id + '">' +
                            '<div class="doc-meta">' +
                                '<div class="doc-name"></div>' +
                                (desc ? '<div class="doc-desc"></div>' : '') +
                                badge +
                            '</div>' +
                        '</label>'
                    );
                }).join("");
                Array.prototype.forEach.call(docList.querySelectorAll(".doc-item"), function (row, i) {
                    var d = currentDocs[i];
                    row.querySelector(".doc-name").textContent = d.name;
                    var descEl = row.querySelector(".doc-desc");
                    if (descEl) descEl.textContent = d.description || "";
                    var cb = row.querySelector('input[type="checkbox"]');
                    cb.addEventListener("change", function () {
                        row.classList.toggle("selected", cb.checked);
                        refreshCount();
                    });
                });
                docsPanel.classList.add("visible");
                refreshCount();
            }

            async function loadPrograms() {
                try {
                    var res = await fetch(withLoc("/api/categories/?request_id=" + encodeURIComponent(requestId) + "&include_empty=1"));
                    var data = await res.json();
                    var cats = data.categories || [];
                    loanSelect.innerHTML = '<option value="">Select a loan program…</option>' +
                        cats.map(function (c) {
                            return '<option value="' + c.id + '"></option>';
                        }).join("");
                    Array.prototype.forEach.call(loanSelect.options, function (opt, i) {
                        if (i === 0) return;
                        opt.textContent = cats[i - 1].name;
                    });
                } catch (e) {
                    loanSelect.innerHTML = '<option value="">Failed to load loan programs</option>';
                    showAlert("Could not load loan programs.", false);
                }
            }

            async function loadDocs(categoryId) {
                clearAlert();
                if (!categoryId) {
                    docsPanel.classList.remove("visible");
                    docList.innerHTML = "";
                    refreshCount();
                    return;
                }
                docList.innerHTML = '<div class="empty">Loading documents…</div>';
                docsPanel.classList.add("visible");
                try {
                    var url = "/api/documents/?request_id=" + encodeURIComponent(requestId) +
                        "&category_id=" + encodeURIComponent(categoryId);
                    var res = await fetch(withLoc(url));
                    var data = await res.json();
                    renderDocs(data.documents || []);
                } catch (e) {
                    docList.innerHTML = '<div class="empty">Failed to load documents.</div>';
                    showAlert("Could not load documents.", false);
                }
            }

            loanSelect.addEventListener("change", function () {
                loadDocs(loanSelect.value);
            });

            btnToggleAll.addEventListener("click", function () {
                var boxes = docList.querySelectorAll('input[type="checkbox"]');
                var allChecked = Array.prototype.every.call(boxes, function (b) { return b.checked; });
                Array.prototype.forEach.call(boxes, function (b) {
                    b.checked = !allChecked;
                    b.closest(".doc-item").classList.toggle("selected", b.checked);
                });
                refreshCount();
            });

            btnSend.addEventListener("click", async function () {
                var ids = selectedIds();
                if (!ids.length) return;
                btnSend.disabled = true;
                btnSend.textContent = "Sending…";
                clearAlert();
                try {
                    var body = { section_type: "individual", document_ids: ids };
                    if (typeof withLocationJsonBody === "function") body = withLocationJsonBody(body);
                    var res = await fetch(withLoc("/api/" + requestId + "/admin/selections/"), {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body)
                    });
                    var data = await res.json();
                    if (!res.ok) throw new Error(data.error || "Send failed");
                    showAlert("Request sent. Client upload link is ready for this opportunity.", true);
                } catch (e) {
                    showAlert(e.message || "Send failed", false);
                } finally {
                    btnSend.textContent = "Send Request";
                    refreshCount();
                }
            });

            loadPrograms();
        })();
    </script>
</body>
</html>
