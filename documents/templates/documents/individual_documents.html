<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Individual Documents</title>
    <style>
        :root {
            --primary: #0b3d91;
            --accent: #1e88e5;
            --border: #d6e4f0;
            --muted: #5a6a7a;
            --danger: #c62828;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(160deg, #e8f4fc, #f4f8fc);
            min-height: 100vh;
            padding: 24px 16px 48px;
            color: #1a2332;
        }
        .wrap { max-width: 720px; margin: 0 auto; }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(11,61,145,.08);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .head {
            padding: 22px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            background: linear-gradient(180deg,#fff,#f8fbff);
        }
        .head h1 { font-size: 22px; color: var(--primary); }
        .head p { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .body { padding: 22px 24px 28px; }
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--primary); }
        input, select, textarea {
            width: 100%; padding: 11px 12px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px; font-family: inherit; margin-bottom: 14px;
        }
        textarea { min-height: 70px; resize: vertical; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn {
            padding: 11px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: #fff; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 14px;
        }
        .btn-primary {
            background: linear-gradient(135deg,#1565c0,#1e88e5); color: #fff; border: none;
        }
        .alert {
            display: none; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; font-weight: 600;
        }
        .alert.show { display: block; }
        .alert.ok { background: #e8f5e9; color: #1b7a4a; }
        .alert.err { background: #ffebee; color: var(--danger); }
        .list { display: grid; gap: 8px; margin-top: 18px; }
        .item {
            border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
            display: flex; justify-content: space-between; gap: 10px; align-items: flex-start;
        }
        .item h4 { font-size: 14px; }
        .item p { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .tag {
            display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700;
            background: #e3f2fd; color: var(--primary); padding: 2px 8px; border-radius: 999px;
        }
        .empty { text-align: center; color: #999; padding: 20px; font-size: 14px; }
        @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    </style>
    <script src="{% static 'documents/ghl_location.js' %}"></script>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="head">
                <div>
                    <h1>Request Individual Documents</h1>
                    <p>Create a custom document for this opportunity only.</p>
                </div>
                <button type="button" class="btn" id="btn-back">← Back</button>
            </div>
            <div class="body">
                <div class="alert" id="alert"></div>
                <form id="form-custom">
                    <div class="row">
                        <div>
                            <label for="loan-program">Loan program *</label>
                            <select id="loan-program" required><option value="">Select</option></select>
                        </div>
                        <div>
                            <label for="mode">Type *</label>
                            <select id="mode" required>
                                <option value="file">File (request only)</option>
                                <option value="template">Template (download + upload)</option>
                            </select>
                        </div>
                    </div>
                    <label for="name">Document name *</label>
                    <input id="name" required placeholder="e.g. Custom Appraisal">
                    <label for="desc">Description (optional)</label>
                    <textarea id="desc" placeholder="What the borrower should upload"></textarea>
                    <div id="tpl-wrap" style="display:none;">
                        <label for="tpl-file">Template file *</label>
                        <input id="tpl-file" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg">
                    </div>
                    <button type="submit" class="btn btn-primary">Create &amp; add to request</button>
                </form>
                <div class="list" id="list"></div>
            </div>
        </div>
    </div>
    <script>
    (function () {
        var requestId = "{{ request_id|escapejs }}";
        var existing = {{ existing_custom_docs_json|default:"[]"|safe }};

        function preserve(path) {
            return typeof preserveQueryHref === "function" ? preserveQueryHref(path) : path + (window.location.search || "");
        }
        function withLoc(url) {
            return typeof withLocationQuery === "function" ? withLocationQuery(url) : url;
        }
        function showAlert(msg, ok) {
            var el = document.getElementById("alert");
            el.textContent = msg;
            el.className = "alert show " + (ok ? "ok" : "err");
        }
        document.getElementById("btn-back").onclick = function () {
            window.location.href = preserve("/" + requestId + "/request/admin/");
        };
        document.getElementById("mode").addEventListener("change", function () {
            var wrap = document.getElementById("tpl-wrap");
            var input = document.getElementById("tpl-file");
            var on = this.value === "template";
            wrap.style.display = on ? "block" : "none";
            input.required = on;
            if (!on) input.value = "";
        });

        async function loadPrograms() {
            var res = await fetch(withLoc("/api/categories/?request_id=" + encodeURIComponent(requestId) + "&include_empty=1"));
            var data = await res.json();
            var sel = document.getElementById("loan-program");
            sel.innerHTML = '<option value="">Select</option>';
            (data.categories || []).forEach(function (c) {
                var opt = document.createElement("option");
                opt.value = c.id;
                opt.textContent = c.name;
                sel.appendChild(opt);
            });
        }

        function renderList(rows) {
            var list = document.getElementById("list");
            if (!rows.length) {
                list.innerHTML = '<div class="empty">No custom documents for this request yet.</div>';
                return;
            }
            list.innerHTML = rows.map(function (d) {
                return '<div class="item"><div><h4>' + escapeHtml(d.name) + '</h4>' +
                    '<p>' + escapeHtml(d.description || "") + '</p>' +
                    '<span class="tag">' + escapeHtml(d.category_name || "") + '</span> ' +
                    '<span class="tag">' + (d.attachment_mode === "template" ? "Template" : "File") + '</span>' +
                    '</div></div>';
            }).join("");
        }
        function escapeHtml(s) {
            return String(s || "").replace(/[&<>"']/g, function (c) {
                return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
            });
        }

        document.getElementById("form-custom").addEventListener("submit", async function (e) {
            e.preventDefault();
            var mode = document.getElementById("mode").value;
            var fd = new FormData();
            fd.append("name", document.getElementById("name").value.trim());
            fd.append("description", document.getElementById("desc").value.trim());
            fd.append("category_id", document.getElementById("loan-program").value);
            fd.append("attachment_mode", mode);
            if (typeof getGhlLocationId === "function") {
                var loc = getGhlLocationId();
                if (loc) fd.append("location_id", loc);
            }
            if (mode === "template") {
                var f = document.getElementById("tpl-file").files[0];
                if (!f) { showAlert("Template file is required", false); return; }
                fd.append("template_file", f);
            }
            try {
                var res = await fetch(withLoc("/api/" + requestId + "/admin/individual/create/"), {
                    method: "POST",
                    body: fd
                });
                var data = await res.json();
                if (!res.ok) throw new Error(data.error || "Create failed");
                showAlert("Custom document created and added to this request.", true);
                e.target.reset();
                document.getElementById("tpl-wrap").style.display = "none";
                existing.unshift({
                    name: data.document.name,
                    description: data.document.description || "",
                    category_name: (data.document.category && data.document.category.name) || "",
                    attachment_mode: data.document.attachment_mode
                });
                renderList(existing);
            } catch (err) {
                showAlert(err.message || "Failed", false);
            }
        });

        loadPrograms().catch(function (e) { showAlert(e.message, false); });
        renderList(existing);
    })();
    </script>
</body>
</html>
