<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog Admin</title>
    <style>
        :root {
            --primary: #1565c0;
            --accent: #2196f3;
            --border: #e0e0e0;
            --bg: #e8f4fc;
            --muted: #666;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #e8f4fc 0%, #e3f2fd 100%);
            min-height: 100vh;
            padding: 24px 16px 48px;
            color: #222;
        }
        .wrap { max-width: 960px; margin: 0 auto; }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 22px 28px;
            border-bottom: 1px solid #e3f2fd;
            background: linear-gradient(180deg, #fff, #f7fbff);
        }
        .header h1 { font-size: 22px; color: var(--primary); }
        .header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2196f3, #42a5f5);
            color: #fff;
            border: none;
        }
        .btn-danger { color: #c62828; border-color: #ffcdd2; }
        .tabs {
            display: flex;
            gap: 8px;
            padding: 16px 28px 0;
            border-bottom: 1px solid #e3f2fd;
        }
        .tab {
            padding: 10px 16px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            color: var(--muted);
            border-bottom: 3px solid transparent;
            font-family: inherit;
            font-size: 14px;
        }
        .tab.active { color: var(--primary); border-bottom-color: var(--accent); }
        .panel { display: none; padding: 24px 28px 32px; }
        .panel.active { display: block; }
        .grid-form {
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr 1fr;
            background: #f8f9fa;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .grid-form .full { grid-column: 1 / -1; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea { min-height: 70px; resize: vertical; }
        .list { display: grid; gap: 8px; }
        .item {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            background: #fff;
        }
        .item h4 { font-size: 14px; margin-bottom: 4px; }
        .item p { font-size: 12px; color: var(--muted); }
        .item-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .btn-edit { color: var(--primary); border-color: #90caf9; }
        .doc-filter-bar {
            display: grid;
            gap: 8px;
            margin-bottom: 14px;
            padding: 14px 16px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        .doc-filter-bar label {
            margin-bottom: 0;
            font-size: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal-backdrop.open { display: flex; }
        .modal-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.22);
            overflow: hidden;
            animation: modal-in .18s ease;
        }
        @keyframes modal-in {
            from { opacity: 0; transform: translateY(8px) scale(.98); }
            to { opacity: 1; transform: none; }
        }
        .modal-card header {
            padding: 18px 20px 12px;
            border-bottom: 1px solid #e3f2fd;
        }
        .modal-card header h3 {
            font-size: 18px;
            color: var(--primary);
            margin: 0;
        }
        .modal-card header p {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--muted);
        }
        .modal-card .modal-body {
            padding: 16px 20px;
            display: grid;
            gap: 12px;
        }
        .modal-card .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px 20px 18px;
            border-top: 1px solid #f1f5f9;
        }
        .tag {
            display: inline-block;
            font-size: 11px;
            background: #e3f2fd;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 999px;
            margin-top: 6px;
        }
        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 13px;
            display: none;
        }
        .alert.show { display: block; }
        .alert.ok { background: #e3f2fd; color: #0d47a1; border: 1px solid #90caf9; }
        .alert.err { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
        .hint { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
        .empty { text-align: center; color: #999; padding: 24px; }
        .panel-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
        }
        .panel-toolbar .hint { margin-bottom: 0; flex: 1; }
        .btn-toggle-form {
            background: #fff;
            color: var(--primary);
            border: 1px solid #90caf9;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }
        .btn-toggle-form:hover,
        .btn-toggle-form.open {
            background: #e3f2fd;
            border-color: var(--accent);
        }
        .collapsible-form {
            display: none;
            margin-bottom: 20px;
        }
        .collapsible-form.open { display: grid; }
        @media (max-width: 700px) {
            .grid-form { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; }
            .panel-toolbar { flex-direction: column; align-items: stretch; }
        }
    </style>
    <script src="{% static 'documents/ghl_location.js' %}"></script>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="header">
                <div>
                    <h1>Catalog Admin</h1>
                    <p>Manage loan programs and documents for this location.</p>
                </div>
                <button type="button" class="btn" onclick="window.location.href=preserveQueryHref('/{{ request_id }}/request/admin/')">← Back</button>
            </div>

            <div id="alert" class="alert"></div>

            <div class="tabs">
                <button type="button" class="tab active" data-tab="categories">Loan Programs</button>
                <button type="button" class="tab" data-tab="documents">Documents</button>
            </div>

            <div class="panel active" id="panel-categories">
                <div class="panel-toolbar">
                    <p class="hint">Loan programs group documents on the Request Documents page.</p>
                    <button type="button" class="btn-toggle-form" data-toggle="form-category" data-label="Add Loan Program">Add Loan Program</button>
                </div>
                <form class="grid-form collapsible-form" id="form-category">
                    <div class="full">
                        <label for="cat-name">Loan program name *</label>
                        <input id="cat-name" name="name" required placeholder="e.g. Fix &amp; Flip">
                    </div>
                    <div class="full">
                        <label for="cat-desc">Description</label>
                        <input id="cat-desc" name="description" placeholder="Optional">
                    </div>
                    <div class="full">
                        <button type="submit" class="btn btn-primary">Add Loan Program</button>
                    </div>
                </form>
                <div class="list" id="list-categories"></div>
            </div>

            <div class="panel" id="panel-documents">
                <div class="panel-toolbar">
                    <p class="hint">Create documents under a loan program. Choose Template (blank download) or File (upload only).</p>
                    <button type="button" class="btn-toggle-form" data-toggle="form-document" data-label="Add Document">Add Document</button>
                </div>
                <form class="grid-form collapsible-form" id="form-document">
                    <div>
                        <label for="doc-category">Loan program *</label>
                        <select id="doc-category" name="category_id" required>
                            <option value="">Select</option>
                        </select>
                    </div>
                    <div>
                        <label for="doc-mode">Type *</label>
                        <select id="doc-mode" name="attachment_mode" required>
                            <option value="file">File (request only)</option>
                            <option value="template">Template (download + upload)</option>
                        </select>
                    </div>
                    <div class="full">
                        <label for="doc-name">Document name *</label>
                        <input id="doc-name" name="name" required placeholder="e.g. Bank Statements">
                    </div>
                    <div class="full">
                        <label for="doc-desc">Description (optional)</label>
                        <textarea id="doc-desc" name="description" placeholder="What the borrower should upload"></textarea>
                    </div>
                    <div class="full" id="doc-template-wrap" style="display:none;">
                        <label for="doc-template-file">Template file *</label>
                        <input id="doc-template-file" name="template_file" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg">
                    </div>
                    <div class="full">
                        <button type="submit" class="btn btn-primary">Add Document</button>
                    </div>
                </form>
                <div class="doc-filter-bar" id="doc-filter-bar">
                    <label for="doc-filter-category">Filter by loan program</label>
                    <select id="doc-filter-category">
                        <option value="">All loan programs</option>
                    </select>
                </div>
                <div class="list" id="list-documents"></div>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="edit-modal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
            <header>
                <h3 id="edit-modal-title">Edit</h3>
                <p id="edit-modal-subtitle">Update the display name.</p>
            </header>
            <form id="edit-modal-form" class="modal-body">
                <input type="hidden" id="edit-kind" value="">
                <input type="hidden" id="edit-id" value="">
                <div>
                    <label for="edit-name">Name *</label>
                    <input id="edit-name" name="name" required maxlength="300" autocomplete="off">
                </div>
                <div>
                    <label for="edit-desc">Description</label>
                    <input id="edit-desc" name="description" maxlength="500" autocomplete="off" placeholder="Optional">
                </div>
                <div class="modal-actions" style="padding:0;border:0;">
                    <button type="button" class="btn" id="edit-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="edit-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
    (function () {
        var requestId = "{{ request_id|escapejs }}";
        var locationId = "{{ location_id|escapejs }}" || (typeof getGhlLocationId === 'function' ? getGhlLocationId() : '');
        var editModal = document.getElementById('edit-modal');
        var editForm = document.getElementById('edit-modal-form');
        var editName = document.getElementById('edit-name');
        var editDesc = document.getElementById('edit-desc');
        var editKind = document.getElementById('edit-kind');
        var editId = document.getElementById('edit-id');

        function showAlert(msg, ok) {
            var el = document.getElementById('alert');
            el.textContent = msg;
            el.className = 'alert show ' + (ok ? 'ok' : 'err');
            setTimeout(function () { el.classList.remove('show'); }, 4000);
        }

        function jsonBody(obj) {
            var data = typeof withLocationJsonBody === 'function' ? withLocationJsonBody(obj) : Object.assign({}, obj);
            if (locationId && !data.location_id) data.location_id = locationId;
            return data;
        }

        async function api(url, opts) {
            var res = await fetch(typeof withLocationQuery === 'function' ? withLocationQuery(url) : url, opts);
            var data = {};
            try { data = await res.json(); } catch (e) {}
            if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
            return data;
        }

        function openEditModal(opts) {
            editKind.value = opts.kind;
            editId.value = opts.id;
            editName.value = opts.name || '';
            editDesc.value = opts.description || '';
            document.getElementById('edit-modal-title').textContent = opts.title || 'Edit';
            document.getElementById('edit-modal-subtitle').textContent = opts.subtitle || 'Update the display name.';
            editModal.classList.add('open');
            editModal.setAttribute('aria-hidden', 'false');
            setTimeout(function () { editName.focus(); editName.select(); }, 0);
        }

        function closeEditModal() {
            editModal.classList.remove('open');
            editModal.setAttribute('aria-hidden', 'true');
            editForm.reset();
            editKind.value = '';
            editId.value = '';
        }

        document.getElementById('edit-cancel').addEventListener('click', closeEditModal);
        editModal.addEventListener('click', function (e) {
            if (e.target === editModal) closeEditModal();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && editModal.classList.contains('open')) closeEditModal();
        });

        editForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var kind = editKind.value;
            var id = editId.value;
            var name = editName.value.trim();
            var description = editDesc.value.trim();
            if (!name) { showAlert('Name cannot be empty', false); return; }
            var saveBtn = document.getElementById('edit-save');
            saveBtn.disabled = true;
            try {
                if (kind === 'category') {
                    await api('/api/categories/' + id + '/', {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(jsonBody({ name: name, description: description }))
                    });
                    showAlert('Loan program updated', true);
                    closeEditModal();
                    await refreshAll();
                } else if (kind === 'document') {
                    await api('/api/documents/' + id + '/', {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(jsonBody({ name: name, description: description }))
                    });
                    showAlert('Document updated', true);
                    closeEditModal();
                    await loadDocuments();
                }
            } catch (err) {
                showAlert(err.message, false);
            } finally {
                saveBtn.disabled = false;
            }
        });

        document.querySelectorAll('.tab').forEach(function (tab) {
            tab.addEventListener('click', function () {
                document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
                document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
                tab.classList.add('active');
                document.getElementById('panel-' + tab.getAttribute('data-tab')).classList.add('active');
            });
        });

        document.querySelectorAll('.btn-toggle-form').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var formId = btn.getAttribute('data-toggle');
                var form = document.getElementById(formId);
                if (!form) return;
                var open = !form.classList.contains('open');
                form.classList.toggle('open', open);
                btn.classList.toggle('open', open);
                var label = btn.getAttribute('data-label') || 'Add';
                btn.textContent = open ? 'Hide Form' : label;
            });
        });

        function closeFormPanel(formId) {
            var form = document.getElementById(formId);
            if (!form) return;
            form.classList.remove('open');
            var btn = document.querySelector('.btn-toggle-form[data-toggle="' + formId + '"]');
            if (btn) {
                btn.classList.remove('open');
                btn.textContent = btn.getAttribute('data-label') || 'Add';
            }
        }

        async function loadCategories() {
            // include_empty=1 so categories without docs still appear (location_id alone hides them)
            var data = await api('/api/categories/?include_empty=1');
            var list = document.getElementById('list-categories');
            var sel = document.getElementById('doc-category');
            var filterSel = document.getElementById('doc-filter-category');
            var prevFilter = filterSel.value || '';
            list.innerHTML = '';
            sel.innerHTML = '<option value="">Select</option>';
            filterSel.innerHTML = '<option value="">All loan programs</option>';
            (data.categories || []).forEach(function (c) {
                var item = document.createElement('div');
                item.className = 'item';
                var docCount = parseInt(c.document_count, 10) || 0;
                item.innerHTML =
                    '<div><h4>' + escapeHtml(c.name) + '</h4><p>' + escapeHtml(c.description || '') + '</p></div>' +
                    '<div class="item-actions">' +
                    '<button type="button" class="btn btn-edit" data-edit-cat="' + c.id +
                    '" data-name="' + escapeAttr(c.name) +
                    '" data-desc="' + escapeAttr(c.description || '') + '">Edit</button>' +
                    '<button type="button" class="btn btn-danger" data-del-cat="' + c.id +
                    '" data-name="' + escapeAttr(c.name) +
                    '" data-doc-count="' + docCount + '">Delete</button>' +
                    '</div>';
                list.appendChild(item);
                var opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.name;
                sel.appendChild(opt);
                var filterOpt = document.createElement('option');
                filterOpt.value = c.id;
                filterOpt.textContent = c.name;
                filterSel.appendChild(filterOpt);
            });
            if (prevFilter && Array.prototype.some.call(filterSel.options, function (o) { return o.value === prevFilter; })) {
                filterSel.value = prevFilter;
            }
            if (!(data.categories || []).length) {
                list.innerHTML = '<div class="empty">No loan programs yet. Click Add Loan Program to create one.</div>';
            }
            list.querySelectorAll('[data-edit-cat]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    openEditModal({
                        kind: 'category',
                        id: btn.getAttribute('data-edit-cat'),
                        name: btn.getAttribute('data-name') || '',
                        description: btn.getAttribute('data-desc') || '',
                        title: 'Edit loan program',
                        subtitle: 'Rename this loan program for the catalog.'
                    });
                });
            });
            list.querySelectorAll('[data-del-cat]').forEach(function (btn) {
                btn.addEventListener('click', async function () {
                    var name = btn.getAttribute('data-name') || 'this loan program';
                    var n = parseInt(btn.getAttribute('data-doc-count'), 10) || 0;
                    var msg = n
                        ? 'Delete "' + name + '"? This will also delete ' + n + ' document(s) in it.'
                        : 'Delete loan program "' + name + '"?';
                    if (!confirm(msg)) return;
                    try {
                        await api('/api/categories/' + btn.getAttribute('data-del-cat') + '/', {
                            method: 'DELETE'
                        });
                        showAlert('Loan program deleted', true);
                        await refreshAll();
                    } catch (e) { showAlert(e.message, false); }
                });
            });
        }

        async function loadDocuments() {
            if (!locationId) {
                document.getElementById('list-documents').innerHTML = '<div class="empty">location_id missing in URL.</div>';
                return;
            }
            var filterCat = (document.getElementById('doc-filter-category').value || '').trim();
            var url = '/api/documents/';
            if (filterCat) url += '?category_id=' + encodeURIComponent(filterCat);
            var data = await api(url);
            var list = document.getElementById('list-documents');
            list.innerHTML = '';
            (data.documents || []).forEach(function (d) {
                var mode = d.attachment_mode === 'template' ? 'Template' : 'File';
                var item = document.createElement('div');
                item.className = 'item';
                item.innerHTML =
                    '<div><h4>' + escapeHtml(d.name) + '</h4><p>' + escapeHtml(d.description || '') + '</p>' +
                    '<span class="tag">' + escapeHtml((d.category && d.category.name) || '') + '</span>' +
                    ' <span class="tag">' + mode + '</span>' +
                    (d.template_url ? ' <a class="tag" href="' + escapeHtml(d.template_url) + '" target="_blank" rel="noopener">Blank file</a>' : '') +
                    '</div>' +
                    '<div class="item-actions">' +
                    '<button type="button" class="btn btn-edit" data-edit-doc="' + d.id +
                    '" data-name="' + escapeAttr(d.name) +
                    '" data-desc="' + escapeAttr(d.description || '') + '">Edit</button>' +
                    '<button type="button" class="btn btn-danger" data-del-doc="' + d.id + '">Delete</button>' +
                    '</div>';
                list.appendChild(item);
            });
            if (!(data.documents || []).length) {
                list.innerHTML = filterCat
                    ? '<div class="empty">No documents in this loan program.</div>'
                    : '<div class="empty">No documents yet. Click Add Document to create one.</div>';
            }
            list.querySelectorAll('[data-edit-doc]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    openEditModal({
                        kind: 'document',
                        id: btn.getAttribute('data-edit-doc'),
                        name: btn.getAttribute('data-name') || '',
                        description: btn.getAttribute('data-desc') || '',
                        title: 'Edit document',
                        subtitle: 'Rename this document in the catalog.'
                    });
                });
            });
            list.querySelectorAll('[data-del-doc]').forEach(function (btn) {
                btn.addEventListener('click', async function () {
                    if (!confirm('Delete this document from the catalog?')) return;
                    try {
                        await api('/api/account/document-library/', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(jsonBody({
                                action: 'delete_owned',
                                document_id: parseInt(btn.getAttribute('data-del-doc'), 10)
                            }))
                        });
                        showAlert('Document deleted', true);
                        await loadDocuments();
                    } catch (e) { showAlert(e.message, false); }
                });
            });
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, function (c) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
            });
        }

        function escapeAttr(s) {
            return escapeHtml(s).replace(/\n/g, ' ');
        }

        async function refreshAll() {
            await loadCategories();
            await loadDocuments();
        }

        document.getElementById('doc-mode').addEventListener('change', function () {
            var wrap = document.getElementById('doc-template-wrap');
            var input = document.getElementById('doc-template-file');
            var isTpl = this.value === 'template';
            wrap.style.display = isTpl ? 'block' : 'none';
            input.required = isTpl;
            if (!isTpl) input.value = '';
        });

        document.getElementById('doc-filter-category').addEventListener('change', function () {
            loadDocuments().catch(function (e) { showAlert(e.message, false); });
        });

        document.getElementById('form-category').addEventListener('submit', async function (e) {
            e.preventDefault();
            try {
                await api('/api/categories/create/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonBody({
                        name: document.getElementById('cat-name').value.trim(),
                        description: document.getElementById('cat-desc').value.trim()
                    }))
                });
                e.target.reset();
                showAlert('Loan program added', true);
                closeFormPanel('form-category');
                await loadCategories();
            } catch (err) { showAlert(err.message, false); }
        });

        document.getElementById('form-document').addEventListener('submit', async function (e) {
            e.preventDefault();
            if (!locationId) { showAlert('location_id required in URL', false); return; }
            var mode = document.getElementById('doc-mode').value;
            var fd = new FormData();
            fd.append('name', document.getElementById('doc-name').value.trim());
            fd.append('description', document.getElementById('doc-desc').value.trim());
            fd.append('category_id', document.getElementById('doc-category').value);
            fd.append('attachment_mode', mode);
            fd.append('location_id', locationId);
            if (mode === 'template') {
                var f = document.getElementById('doc-template-file').files[0];
                if (!f) { showAlert('Template file is required', false); return; }
                fd.append('template_file', f);
            }
            try {
                var res = await fetch(
                    typeof withLocationQuery === 'function' ? withLocationQuery('/api/documents/create/') : '/api/documents/create/',
                    { method: 'POST', body: fd }
                );
                var data = {};
                try { data = await res.json(); } catch (err) {}
                if (!res.ok) throw new Error(data.error || 'Create failed');
                e.target.reset();
                document.getElementById('doc-template-wrap').style.display = 'none';
                document.getElementById('doc-template-file').required = false;
                showAlert('Document added', true);
                closeFormPanel('form-document');
                await loadDocuments();
            } catch (err) { showAlert(err.message, false); }
        });

        if (!locationId) {
            showAlert('Open this page with ?location_id= your GHL location id', false);
        }
        refreshAll().catch(function (e) { showAlert(e.message, false); });
    })();
    </script>
</body>
</html>
